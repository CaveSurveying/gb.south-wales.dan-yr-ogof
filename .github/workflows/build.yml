# Build Dan yr Ogof's 3D view with cave-viewer (its shared workflow) on every push, pull
# request and run by hand, and publish it to GitHub Pages from main (a pull request is built,
# not published). Pages' source is GitHub Actions.
name: Build the 3D view
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  site:
    uses: CaveSurveying/cave-viewer/.github/workflows/build.yml@v0.7.2
    with:
      config: caves.json
      apt-packages: survex subversion
      therion-image: ghcr.io/paperclipmonkey/therion:6.4.0
      deploy: ${{ github.event_name != 'pull_request' }}
